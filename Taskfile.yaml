version: '3'

vars:
  VERSION: "1.20"
  BIN_NAME: "ranga-{{.VERSION}}"
  BIN_DIR: "bin"

tasks:
  build:
    desc: Build the Go binary for the engine
    cmds:
      - go build -ldflags="-X main.version={{.VERSION}}" -o {{.BIN_DIR}}/{{.BIN_NAME}} ./cmd
      - chmod +x {{.BIN_DIR}}/{{.BIN_NAME}}

  run:
    desc: Build and execute the engine
    deps:
      - build
    cmds:
      - ./{{.BIN_DIR}}/{{.BIN_NAME}}

  bench:
    desc: Run bench command on binary
    deps:
      - build
    cmds:
      - ./{{.BIN_DIR}}/{{.BIN_NAME}} bench

  test:
    desc: Run all tests in the repository
    cmds:
      - go test ./...

  cover:
    desc: Run tests and generate a visual HTML coverage report
    cmds:
      - go test -coverprofile=cover.out ./...
      - go tool cover -html=cover.out

  race:
    desc: Run race condition tests
    cmds:
      - go test --race ./...

  clean:
    desc: Remove binaries and clean the Go cache
    cmds:
      - rm -rf {{.BIN_DIR}}/{{.BIN_NAME}}
      - go clean -cache -testcache -modcache

  build-docker:
    desc: Build using Docker exporter (Host architecture)
    cmds:
      - docker build --build-arg VERSION={{.VERSION}} --target exporter --output ./{{.BIN_DIR}} .

  build-linux:
      desc: Cross-compile natively for Linux (amd64)
      cmds:
        - task: internal-cross-build
          vars: { OS: 'linux', ARCH: 'amd64' }

  build-windows:
    desc: Cross-compile natively for Windows (amd64)
    cmds:
      - task: internal-cross-build
        vars: { OS: 'windows', ARCH: 'amd64', EXT: '.exe' }

  build-mac:
    desc: Cross-compile natively for macOS (arm64)
    cmds:
      - task: internal-cross-build
        vars: { OS: 'darwin', ARCH: 'arm64' }

  internal-cross-build:
    internal: true
    desc: Internal template for native cross-compilation
    requires:
      vars: [OS, ARCH]
    cmds:
      - env CGO_ENABLED=0 GOOS={{.OS}} GOARCH={{.ARCH}} go build -ldflags="-X 'main.version={{.VERSION}}'" -o {{.BIN_DIR}}/{{.BIN_NAME}}-{{.OS}}-{{.ARCH}}{{if .EXT}}{{.EXT}}{{end}} ./cmd

name: Test and Build

on:
  push:
    branches:
      - 'main'
      - 'release/**'
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
    branches:
      - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Test, Coverage & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run Tests
        run: make test

      - name: Run Coverage
        run: make cover

      - name: Run Race
        run: make race

      - name: Build Engine Binary
        run: make build

      - name: Run bench
        run: make bench

      - name: Cleanup
        run: make clean
